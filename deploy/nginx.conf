# Template rendered by the deployment scripts using NODECHECK_DOMAIN.
# Do not install this template directly or replace an existing site's config.
server {
    listen 80;
    listen [::]:80;
    server_name __NODECHECK_DOMAIN__;
    access_log off;
    error_log /dev/null crit;
    location /.well-known/acme-challenge/ { root /var/lib/nodecheck-acme; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name __NODECHECK_DOMAIN__;
    ssl_certificate /etc/letsencrypt/live/__NODECHECK_DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__NODECHECK_DOMAIN__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log off;
    error_log /dev/null crit;
    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 101m;
    client_body_buffer_size 8m;
    client_body_in_single_buffer on;
    client_body_timeout 20s;
    keepalive_timeout 20s;

    location / {
        proxy_pass http://127.0.0.1:18765;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_max_temp_file_size 0;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}
